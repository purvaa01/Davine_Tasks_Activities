services:

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "8007:80"

    depends_on:
      - backend

    networks:
      - app-network

  backend:
    build: ./backend
    container_name: backend

    ports:
      - "5000:5000"

    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: root123
      DB_NAME: davinedb

    depends_on:
      - db

    networks:
      - app-network

  db:
    image: mysql:8.4

    container_name: mysql-db

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: davinedb

    volumes:
      - mysql-data:/var/lib/mysql

    networks:
      - app-network

volumes:

  mysql-data:

networks:

  app-network:
