apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-deployment
  namespace: deployment-demo

spec:
  replicas: 3

  selector:
    matchLabels:
      app: web-app

  template:
    metadata:
      labels:
        app: web-app

    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
